version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lumodesk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lumodesk
    ports:
      - "5432:5432"
    volumes:
      - lumodesk_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lumodesk_db_data:
